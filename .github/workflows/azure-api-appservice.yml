name: Deploy API to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/azure-api-appservice.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      API_APP_PATH: apps/api
      PACKAGE_PATH: ./.azure/api-package
      PACKAGE_ZIP: ./.azure/api-package.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --dir ${{ env.API_APP_PATH }} build

      - name: Prepare deployment package
        shell: bash
        run: |
          rm -rf "${PACKAGE_PATH}"
          rm -f "${PACKAGE_ZIP}"
          mkdir -p "${PACKAGE_PATH}"
          cp -r "${API_APP_PATH}/dist" "${PACKAGE_PATH}/dist"
          cp "${API_APP_PATH}/package.json" "${PACKAGE_PATH}/package.json"
          pushd "${PACKAGE_PATH}"
          npm install --omit=dev
          zip -r "../api-package.zip" .
          popd

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ${{ env.PACKAGE_ZIP }}
