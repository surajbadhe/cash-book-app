name: Deploy Web to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/azure-static-web-app.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Inject Azure production URLs
        shell: bash
        run: |
          cat <<EOF > apps/web/src/environments/environment.prod.ts
          export const environment = {
            production: true,
            apiUrl: '${{ secrets.AZURE_API_BASE_URL }}/api',
            oauth: {
              googleUrl: '${{ secrets.AZURE_API_BASE_URL }}/api/auth/google',
              githubUrl: '${{ secrets.AZURE_API_BASE_URL }}/api/auth/github',
            },
          };
          EOF

      - name: Check secret is set
        shell: bash
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: AZURE_STATIC_WEB_APPS_API_TOKEN secret is empty or not set!"
            exit 1
          fi
          echo "Token is set (length: ${#TOKEN})"
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular app
        run: pnpm --dir apps/web build:prod

      - name: Find build output
        run: |
          echo "=== apps/web/dist contents ==="
          find apps/web/dist -type f -name "index.html" 2>/dev/null || echo "No index.html found"
          ls -la apps/web/dist/ 2>/dev/null || echo "No dist folder"
          ls -la apps/web/dist/web/ 2>/dev/null || true
          ls -la apps/web/dist/web/browser/ 2>/dev/null || true

      - name: Deploy via SWA CLI
        run: |
          # Use browser subfolder if it exists (Angular 17+), otherwise dist/web
          if [ -d "apps/web/dist/web/browser" ]; then
            DEPLOY_PATH="apps/web/dist/web/browser"
          else
            DEPLOY_PATH="apps/web/dist/web"
          fi
          echo "Deploying from: $DEPLOY_PATH"
          npx --yes @azure/static-web-apps-cli deploy "$DEPLOY_PATH" \
            --deployment-token "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" \
            --env production
