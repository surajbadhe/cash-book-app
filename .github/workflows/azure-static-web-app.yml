name: Deploy Web to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/azure-static-web-app.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Inject Azure production URLs
        shell: bash
        run: |
          cat <<EOF > apps/web/src/environments/environment.prod.ts
          export const environment = {
            production: true,
            apiUrl: '${{ secrets.AZURE_API_BASE_URL }}/api',
            oauth: {
              googleUrl: '${{ secrets.AZURE_API_BASE_URL }}/api/auth/google',
              githubUrl: '${{ secrets.AZURE_API_BASE_URL }}/api/auth/github',
            },
          };
          EOF

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "apps/web/dist/web"
          app_build_command: "pnpm install --frozen-lockfile && pnpm --dir apps/web build:prod"
