# Fly.io configuration for the Angular frontend
# Deploy with: flyctl deploy -c fly.web.toml --build-arg BUILD_CONTEXT=.
app = "cash-book-web"
primary_region = "sin"

[build]
  dockerfile = "apps/web/Dockerfile.fly"

[http_service]
  internal_port        = 80
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    timeout      = "5s"

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
