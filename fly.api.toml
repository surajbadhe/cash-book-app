# Fly.io configuration for the NestJS API
# Deploy with: flyctl deploy -c fly.api.toml --build-arg BUILD_CONTEXT=.
app = "cash-book-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "3000"

# Set these secrets via CLI (never commit real values):
#   flyctl secrets set -a cash-book-api \
#     MONGODB_URI="..." \
#     JWT_SECRET="..." \
#     JWT_ACCESS_EXPIRY="15m" \
#     JWT_REFRESH_EXPIRY="7d" \
#     CLIENT_URL="https://cash-book-web.fly.dev" \
#     BCRYPT_ROUNDS="10" \
#     RATE_LIMIT_TTL="60" \
#     RATE_LIMIT_MAX="100"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/api"
    timeout      = "5s"

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
